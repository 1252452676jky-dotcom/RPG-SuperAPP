<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Lab</title>
<link rel="icon" href="favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="game/cybersleuth.css">
</head>
<body class="cs">
  <!-- same auth gate as the habit app (cloud.js needs these ids) -->
  <div id="authGate" class="cs-gate">
    <div><h1 class="cs-logo">MONSTER<span>◎</span>LAB</h1>
      <button id="signInBtn" class="cs-btn">Sign in with Google</button>
      <p id="authMsg"></p>
      <button onclick="bootApp()" class="cs-link">Continue without sync</button></div>
  </div>
  <span id="syncStatus" class="cs-sync"></span><span id="gemDisplay" hidden></span>

  <div class="cs-bg"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <main class="cs-menu" id="csMenu">
    <h1 class="cs-logo">MONSTER<span>◎</span>LAB</h1>
    <div class="cs-strip">DIGITAL MONSTER RUN</div>
    <nav class="cs-items">
      <button data-go="A">Mode A — Classic Run</button>
      <button data-go="B">Mode B — Card Run</button>
      <button data-go="dex">Dex</button>
      <button data-go="lab">Collection &amp; Gacha</button>
      <a href="index.html">Back to Habit Quest</a>
    </nav>
    <p class="cs-copy">Unofficial fan project · Pokémon © Nintendo/Game Freak · Palworld © Pocketpair · Digimon © Bandai Namco/Toei</p>
  </main>
  <section id="csLab" class="cs-lab" hidden><button class="cs-btn cs-back" data-go="menu">◀ Menu</button><div id="labContent"></div></section>

  <!-- hidden habit shell so app.js / cloud.js run unchanged -->
  <div hidden><nav id="mainNav"></nav><main id="content"></main></div>
  <div id="toastWrap"></div>
  <div id="modal" class="hidden fixed inset-0 z-[10001] modal-bg flex items-center justify-center p-4" onmousedown="modalDown(event)" onmouseup="modalUp(event)">
    <div class="cs-modal max-w-2xl w-full max-h-[90vh] overflow-y-auto p-5" id="modalInner"></div>
  </div>

  <script src="app.js"></script>
  <script src="game/effects.js"></script>
  <script src="game/battle.js"></script>
  <script src="game/vfx.js"></script>
  <script src="game/battle-ui.js"></script>
  <script src="game/cardbattle.js"></script>
  <script src="game/run.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="game/editor.js"></script>
  <script src="game/gacha.js"></script>
  <script src="game/dex.js"></script>
  <script>
    // the game page has no habit tabs: redirect app.js's render() to the open game panel
    const labEl = document.getElementById('labContent'), labSec = document.getElementById('csLab'), menu = document.getElementById('csMenu');
    render = function () { if (!labSec.hidden) GameTabs.gacha(labEl); };
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-go]'); if (!b) return;
      const g = b.dataset.go;
      if (g === 'A' || g === 'B') MonsterRun.openMode(g);
      else if (g === 'dex') MonsterDex.open();
      else if (g === 'lab') { menu.hidden = true; labSec.hidden = false; appState.activeTab = 'gacha'; render(); }
      else if (g === 'menu') { labSec.hidden = true; menu.hidden = false; }
    });
  </script>
  <script type="module" src="cloud.js"></script>
  <script type="module" src="game/game-cloud.js"></script>
</body>
</html>
