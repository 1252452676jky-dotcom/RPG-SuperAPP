<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG Productivity Superapp</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="icons/icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24">
  <div id="authGate" class="fixed inset-0 z-[80] bg-slate-900 flex items-center justify-center p-6">
    <div class="text-center max-w-sm">
      <h1 class="text-2xl font-bold text-indigo-300 mb-2"><i class="fa-solid fa-dragon"></i> RPG Superapp</h1>
      <p class="text-sm text-slate-400 mb-5">Sign in to load and sync your data across devices.</p>
      <button id="signInBtn" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded font-bold">
        <i class="fa-brands fa-google"></i> Sign in with Google
      </button>
      <p id="authMsg" class="text-xs text-rose-300 mt-4 min-h-[1rem]"></p>
      <button onclick="bootApp()" class="text-xs text-slate-500 hover:text-slate-300 mt-4 underline">
        Continue without sync (this device only)
      </button>
    </div>
  </div>


<header class="sticky top-0 z-40 bg-slate-800 border-b-4 border-indigo-600 px-4 py-2 flex items-center justify-between flex-wrap gap-2">
  <h1 class="text-lg font-bold text-indigo-300"><i class="fa-solid fa-dragon"></i> RPG Superapp</h1>
  <div class="flex items-center gap-3">
    <span id="syncStatus" class="text-xs" title="Sync status"><i class="fa-solid fa-cloud text-slate-500"></i></span>
    <button onclick="cloudSignOut()" class="bg-slate-600 hover:bg-slate-500 px-2 py-1 rounded text-xs" title="Sign out"><i class="fa-solid fa-right-from-bracket"></i></button>

    <span class="text-amber-300 text-sm font-bold" title="Gems"><i class="fa-solid fa-gem"></i> <span id="gemDisplay">0</span></span>
    <button onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded text-sm"><i class="fa-solid fa-download"></i> Export JSON</button>
    <label class="bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded text-sm cursor-pointer"><i class="fa-solid fa-upload"></i> Import JSON
      <input type="file" accept=".json" class="hidden" onchange="importData(event)">
    </label>
  </div>
</header>

<nav id="mainNav" class="flex flex-wrap gap-1 px-3 py-2 bg-slate-800/60"></nav>
<main id="content" class="p-4 max-w-6xl mx-auto"></main>

<div id="toastWrap"></div>

<div id="modal" class="hidden fixed inset-0 z-50 modal-bg flex items-center justify-center p-4"
     onmousedown="modalDown(event)" onmouseup="modalUp(event)">
  <div class="bg-slate-800 border-2 border-indigo-500 rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto p-5" id="modalInner"></div>
</div>


<script src="app.js"></script>
<script src="game/gacha.js"></script>
<script type="module" src="cloud.js"></script>
<script type="module" src="game/game-cloud.js"></script
</body>
</html>
